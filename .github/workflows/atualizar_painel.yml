name: Atualizar painel

on:
  push:
    paths:
      - "dados/entrada/**"
      - "scripts/**"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/processar_camadas.py
      - name: Publicar resultado
        run: |
          git config user.name "painel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet || git commit -m "Atualiza camadas do painel [automático]"
          git push
